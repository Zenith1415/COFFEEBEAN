name: COFFEEBEAN CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  PYTHONUTF8: "1"

jobs:
  # ── Job 1: Run Tests ──────────────────────────────────────────────────────
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all tests
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  # ── Job 2: Build & Push Docker Images to Docker Hub ───────────────────────
  docker-build-push:
    name: Build & Push Docker Images to Docker Hub
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Normalize username to lowercase and log in
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Strip leading/trailing whitespace or newlines
          CLEAN_USER=$(echo "$DOCKER_USER" | tr -d '[:space:]')
          CLEAN_TOKEN=$(echo "$DOCKER_TOKEN" | tr -d '[:space:]')
          LOWER_USER=$(echo "$CLEAN_USER" | tr '[:upper:]' '[:lower:]')
          
          echo "$CLEAN_TOKEN" | docker login -u "$CLEAN_USER" --password-stdin
          echo "DOCKER_REPO_OWNER=$LOWER_USER" >> $GITHUB_ENV

      # ── Build & Push Main Image ──
      - name: Build and push Main Docker image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPO_OWNER }}/coffeebean:latest
            ${{ env.DOCKER_REPO_OWNER }}/coffeebean:${{ github.sha }}

      # ── Build & Push Edge Image ──
      - name: Build and push Edge Docker image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.edge
          push: true
          tags: |
            ${{ env.DOCKER_REPO_OWNER }}/coffeebean-edge:latest
            ${{ env.DOCKER_REPO_OWNER }}/coffeebean-edge:${{ github.sha }}

  # ── Job 3: Model Validation (on main only) ────────────────────────────────
  validate-model:
    name: Validate Model Artifact
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check ONNX model if present
        run: |
          if [ -f "models/anc_model.onnx" ]; then
            python -c "
          import onnx
          m = onnx.load('models/anc_model.onnx')
          onnx.checker.check_model(m)
          print('ONNX model valid')
          "
          else
            echo "No ONNX model found in repo — skipping validation"
          fi
