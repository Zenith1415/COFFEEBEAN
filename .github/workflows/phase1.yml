name: Phase 1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v3
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install dvc
      - run: pip install pytest
      - run: dvc init -f
      - run: pytest tests/